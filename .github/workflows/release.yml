name: Release ShaderX

on:
  workflow_dispatch:
    inputs:
      confirmVersion:
        description: Exact stable shaderxVersion in gradle.properties (main only)
        type: string
        required: true

permissions:
  contents: read

# Serialize immutable stable publication and tag reservation.
concurrency:
  group: shaderx-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate configured stable release against tags and Maven Central
        id: version
        env:
          CONFIRM_VERSION: ${{ inputs.confirmVersion }}
        run: python scripts/release_version.py
      - name: Check publishing credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD GPG_KEY_CONTENTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install library and configured sample Android platforms
        run: |
          sdk_platform=$(python -c 'import tomllib; version = str(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["android-compileSdk"]); print(f"{version}.0" if version.isdigit() and int(version) >= 37 else version)')
          sdkmanager "platforms;android-35" "platforms;android-$sdk_platform"
      - name: Set up Chrome for library browser tests
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Test release tooling
        run: python -m unittest discover -s scripts/tests -v
      - name: Build and test all library targets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: ./gradlew :shaderx:build --no-daemon --no-configuration-cache "-PshaderxVersion=$RELEASE_VERSION"
      - name: Prepare curated release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PYNOTES'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from release_version import changelog_section, github_release_body
          version = os.environ["RELEASE_VERSION"]
          body = changelog_section(Path("CHANGELOG.md").read_text(encoding="utf-8"), version)
          body = github_release_body(body, os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"])
          notes = (
              f"Built from `{os.environ['GITHUB_REF_NAME']}` (`{os.environ['GITHUB_SHA']}`).\n\n"
              f'```kotlin\nimplementation("io.github.debanshu777:shaderx:{version}")\n```\n\n'
              + body + "\n"
          )
          (Path(os.environ["RUNNER_TEMP"]) / "shaderx-release-notes.md").write_text(notes, encoding="utf-8")
          PYNOTES
      - name: Recheck coordinate before reserving the immutable tag
        env:
          CONFIRM_VERSION: ${{ inputs.confirmVersion }}
        run: python scripts/release_version.py
      - name: Reserve release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Atomic creation fails if another publisher has already claimed this version.
          # Reserve before publishing: Maven Central versions cannot be overwritten.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
      - name: Publish and release to Maven Central
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
        run: ./gradlew :shaderx:publishAndReleaseToMavenCentral --no-daemon --no-configuration-cache "-PshaderxVersion=$RELEASE_VERSION"
      - name: Create GitHub release and dependency snippet
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          notes="$RUNNER_TEMP/shaderx-release-notes.md"
          args=(--verify-tag --title "ShaderX $RELEASE_VERSION" --notes-file "$notes" --generate-notes)
          if [ -n "$PREVIOUS_TAG" ]; then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          args+=(--latest)
          gh release create "$RELEASE_TAG" "${args[@]}"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: |
            shaderx/build/reports/tests/
            shaderx/build/test-results/
          if-no-files-found: ignore
